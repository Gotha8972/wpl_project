<!DOCTYPE html>
<html>
<head>
    <title>
        {% if edit_mode %}
            Edit Transaction
        {% else %}
            Add Transaction
        {% endif %}
    </title>
</head>
<body>

<h2>
    {% if edit_mode %}
        Edit Transaction ✏️
    {% else %}
        Add Transaction ➕
    {% endif %}
</h2>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">
        {% if edit_mode %}Update{% else %}Save{% endif %}
    </button>
</form>

<br>
<a href="{% url 'home' %}">⬅ Back to Dashboard</a>

</body>
</html>
