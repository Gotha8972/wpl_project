{% extends 'base.html' %}

{% block content %}
<h2>Your Budgets</h2>

<table border="1">
    <tr>
        <th>Category</th>
        <th>Limit</th>
        <th>Month</th>
        <th>Year</th>
    </tr>

    {% for budget in budgets %}
    <tr>
        <td>{{ budget.category.name }}</td>
        <td>₹ {{ budget.amount }}</td>
        <td>{{ budget.month }}</td>
        <td>{{ budget.year }}</td>
    </tr>
    {% empty %}
    <tr>
        <td colspan="4">No budgets set yet.</td>
    </tr>
    {% endfor %}
</table>

<a href="{% url 'add_budget' %}">➕ Add Budget</a>
{% endblock %}
